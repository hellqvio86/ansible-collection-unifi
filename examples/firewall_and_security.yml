---
- name: Manage UniFi Firewall & Security Policies
  hosts: localhost
  connection: local
  gather_facts: false

  module_defaults:
    group/hellqvio86.unifi.unifi:
      host: "{{ lookup('env', 'UNIFI_HOST') | default('192.0.2.1', true) }}"
      api_key: "{{ lookup('env', 'UNIFI_API_KEY') | default(omit, true) }}"
      username: "{{ lookup('env', 'UNIFI_USERNAME') | default('admin', true) }}"
      password: "{{ lookup('env', 'UNIFI_PASSWORD') | default('password', true) }}"
      site: "{{ lookup('env', 'UNIFI_SITE') | default('default', true) }}"
      validate_certs: "{{ lookup('env', 'UNIFI_VALIDATE_CERTS') | default('true', true) | bool }}"

  tasks:
    - name: Create Management IP Group
      hellqvio86.unifi.unifi_firewall_group:
        name: "Admin-Workstations"
        group_type: "address-group"
        group_members:
          - "192.168.1.10"
          - "192.168.1.11"
        state: present

    - name: Create Custom Security Zone for Servers
      hellqvio86.unifi.unifi_firewall_zone:
        name: "DMZ"
        networks:
          - "Default"
        state: present

    - name: Block Guest traffic to DMZ
      hellqvio86.unifi.unifi_firewall_policy:
        name: "Drop Guest to DMZ"
        action: DROP
        protocol: all
        source:
          zone: "Guest"
        destination:
          zone: "DMZ"
        logging: true
        state: present

    - name: Configure Port Forward for Web Server
      hellqvio86.unifi.unifi_port_forward:
        name: "HTTPS Ingress"
        from_port: 443
        fwd_port: 8443
        fwd_ip: "192.168.1.80"
        proto: tcp
        enabled: true
        state: present
