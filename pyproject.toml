[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["ansible_collections"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
norecursedirs = [".venv", "ansible_collections", ".ansible", "releases"]
pythonpath = ["."]

